<style>
/* Visual de conversa no Direct (inspirado, sem marca do Instagram) */
:root{--me:#3797f0;--bub:#262626}
html,body{height:100%}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#000;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid #262626}
.hd a.back{color:#fff;text-decoration:none;font-size:30px;line-height:1;padding-right:2px}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;position:relative}
.av img,.mini img,.big img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.av:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#2ecc71;border:2px solid #000}
.hd b{display:block;font-size:15.5px;font-weight:600}
.hd small{font-size:12.5px;color:#a8a8a8}
#chat{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px}
.top{text-align:center;padding:18px 0 20px;color:#a8a8a8;font-size:13.5px}
.big{width:92px;height:92px;border-radius:50%;overflow:hidden;margin:0 auto 10px}
.top b{display:block;color:#fff;font-size:17px;font-weight:600;margin-bottom:2px}
.ln{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:86%;animation:in .25s ease-out}
.mini{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;visibility:hidden}
.ln.last .mini{visibility:visible}
.m{padding:9px 13px;border-radius:20px;font-size:15.5px;line-height:1.38;animation:in .25s ease-out}
.v{background:var(--bub);color:#f5f5f5}
.v b{color:#fff}
.u{align-self:flex-end;background:var(--me);color:#fff;max-width:80%;margin:6px 0}
.typing{align-self:flex-start;background:var(--bub);border-radius:20px;padding:13px 15px;display:flex;gap:4px;margin-left:36px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e8e;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#reply{padding:10px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;min-height:62px;align-items:center;justify-content:flex-end}
.chip{border:1.5px solid #3797f0;background:transparent;color:#fff;font-size:15px;font-weight:600;padding:9px 15px;border-radius:22px;cursor:pointer;font-family:Inter,sans-serif}
.chip:active{background:#3797f0}
.row{display:flex;gap:8px;width:100%;background:#262626;border-radius:24px;padding:4px 4px 4px 16px;align-items:center}
.row input{flex:1;font-size:16px;padding:9px 0;border:0;background:transparent;color:#fff;outline:none;font-family:Inter,sans-serif}
.row input::placeholder{color:#8e8e8e}
.send{background:#3797f0;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:16px;cursor:pointer;flex:none}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:14px;border-radius:26px;font-family:Montserrat,sans-serif}
.wa svg{width:22px;height:22px}
.fine{width:100%;text-align:center;font-size:11.5px;color:#8e8e8e;margin-top:2px}
</style>
<div class="app">
  <div class="hd"><a class="back" href="/" aria-label="Voltar ao site">‹</a><div class="av"><img src="/img/vanessa-perfil.jpg" alt="Vanessa"></div><div><b>Vanessa Kreitchmann</b><small id="st">Online agora</small></div></div>
  <div id="chat"><div class="top"><div class="big"><img src="/img/vanessa-perfil.jpg" alt="Vanessa Kreitchmann"></div><b>Vanessa Kreitchmann</b>vankreitchmann · Consultoria de raquetes de beach tennis</div></div>
  <div id="reply"></div>
</div>
<script>
const WHATSAPP = "555189418635";
const chat=document.getElementById('chat'), reply=document.getElementById('reply'), st=document.getElementById('st');
const utm=new URLSearchParams(location.search);
const origem=["utm_source","utm_campaign","utm_content"].map(k=>utm.get(k)).filter(Boolean).join(" / ")||"site";
const A={};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const scroll=()=>{chat.scrollTop=chat.scrollHeight;requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight});setTimeout(()=>{chat.scrollTop=chat.scrollHeight},300)};
try{new ResizeObserver(()=>{chat.scrollTop=chat.scrollHeight}).observe(chat)}catch(e){}
async function say(html){
  st.textContent="digitando…";
  const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';chat.appendChild(t);scroll();
  await wait(Math.min(400+html.replace(/<[^>]+>/g,'').length*9,1200));
  t.remove();st.textContent="Online agora";
  chat.querySelectorAll('.ln.last').forEach(x=>x.classList.remove('last'));const l=document.createElement('div');l.className='ln last';l.innerHTML='<div class="mini"><img src="/img/vanessa-perfil.jpg" alt=""></div>';const m=document.createElement('div');m.className='m v';m.innerHTML=html;l.appendChild(m);chat.appendChild(l);scroll();await wait(220);
}
function me(text){const m=document.createElement('div');m.className='m u';m.textContent=text;chat.appendChild(m);scroll()}
function choose(opts){return new Promise(res=>{reply.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{reply.innerHTML='';me(o);res(o)};reply.appendChild(b)});scroll()})}
function ask(ph){return new Promise(res=>{reply.innerHTML=`<div class="row"><input id="tx" placeholder="${ph}" maxlength="80" autocomplete="off"><button class="send" id="sd" aria-label="Enviar">➤</button></div>`;
  const tx=document.getElementById('tx'),go=()=>{const v=tx.value.trim()||"Não sei";reply.innerHTML='';me(v);res(v)};
  document.getElementById('sd').onclick=go;tx.onkeydown=e=>{if(e.key==='Enter')go()};tx.focus({preventScroll:true});scroll();})}
const WA_ICON='<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>';
const track=(ev,data)=>{try{fbq('track',ev,data)}catch(e){}try{ttq.track(ev==='Contact'?'Contact':'SubmitForm')}catch(e){}};

function perfil(){
  const dor=A.dor!=="Não sinto nada", ini=A.categoria==="Iniciante"||A.incomoda==="Ainda não tenho raquete";
  const comp=A.torneio!=="Não, jogo por diversão", intenso=["3x","4x ou mais"].includes(A.freq);
  if(dor) return {n:"Raquete pesando no braço",p:`Desconforto no ${A.dor.toLowerCase()} é o relato que eu mais escuto nas consultorias${intenso?', ainda mais em quem joga '+A.freq+' por semana':''}. Muitas vezes tem a ver com peso, balance ou rigidez da raquete, e não com o seu jogo.`,
    b:["Peso e balance podem estar sobrecarregando o braço","A rigidez da raquete muda o impacto a cada batida","Às vezes nem precisa trocar: um ajuste já resolve"]};
  if(ini) return {n:"Primeira raquete",p:"Você está na melhor hora para acertar. A primeira raquete certa faz o jogo evoluir bem mais rápido e evita gastar duas vezes.",
    b:["Raquete muito avançada atrapalha quem está começando","Peso e formato certos dão confiança desde o início","Você evita a compra por impulso (ou por indicação de vendedor)"]};
  if(A.incomoda==="Falta potência") return {n:"Jogo pedindo mais potência",p:"A sensação de que a bola não sai pode vir da configuração da raquete, não só da técnica.",
    b:["Balance e EVA mudam a saída de bola","Raquete mais pesada nem sempre é mais potente","Dá pra ganhar força sem perder controle"]};
  if(A.incomoda==="Falta controle") return {n:"Jogo pedindo mais controle",p:"Bola que foge e erros a mais costumam ter relação com uma raquete que não combina com o seu estilo.",
    b:["Ponto doce e balance influenciam a precisão","Raquete muito rígida pode deixar a bola 'escapar'","O ajuste certo dá mais consistência nos pontos longos"]};
  if(A.incomoda==="Canso rápido") return {n:"Raquete pesada para o seu ritmo",p:`Cansar no fim do jogo${intenso?' jogando '+A.freq+' por semana':''} é sinal de que o equipamento pode estar exigindo mais do que deveria.`,
    b:["Peso total e balance pesam mais do que parece","Fadiga derruba a técnica no fim do set","Uma configuração mais leve pode render mais"]};
  if(comp) return {n:"Competidor(a) buscando o próximo nível",p:`Na categoria ${A.categoria}, com torneios no calendário, os detalhes do equipamento fazem diferença em resultado.`,
    b:["Configuração alinhada ao seu estilo de jogo","Mais consistência quando a pressão aumenta","Decisão técnica, sem influência de marca"]};
  return {n:"Ajuste fino no equipamento",p:"Seu jogo está bem encaminhado. Com peso, balance e EVA alinhados ao seu estilo, dá pra ganhar controle e conforto.",
    b:["Pequenos ajustes, grande diferença","Saber se a sua raquete atual ainda é a ideal","Escolha certa na próxima troca"]};
}

(async()=>{
  await wait(400);
  await say("Oi! Aqui é a Vanessa 👋🎾");
  await say("Já são <b>mais de 80 mil consultorias realizadas</b>, com atletas de <b>mais de 12 países</b> 🌎");
  await say("E já participei do lançamento de <b>mais de 50 marcas</b> no mercado. Então eu conheço raquete por dentro 🏆");
  await say("E não, eu <b>não vendo raquete</b> 😉 Te ajudo a escolher a certa.");
  await say("Bora ver se a sua <b>combina com o seu jogo</b>? São 7 perguntas rapidinhas.");
  try{fbq('track','ViewContent',{content_name:'quiz_inicio'})}catch(e){}
  await say("Qual a sua <b>categoria</b> hoje?");
  A.categoria=await choose(["Iniciante","D","C","B","A / Pro"]);
  await say(A.categoria==="Iniciante"?"Que bom que tá começando! É a melhor hora pra acertar a raquete 😉":`Boa! Categoria ${A.categoria} 💪`);
  await say("Quantas vezes por semana você joga?");
  A.freq=await choose(["1x","2x","3x","4x ou mais"]);
  await say("E torneio, você disputa?");
  A.torneio=await choose(["Sim, com frequência","De vez em quando","Não, jogo por diversão"]);
  await say("Você sente algum <b>desconforto</b> depois de jogar?");
  A.dor=await choose(["Cotovelo","Ombro","Punho / mão","Outro lugar","Não sinto nada"]);
  if(A.dor!=="Não sinto nada")await say(`Hum, ${A.dor.toLowerCase()}… é o que eu mais escuto nas consultorias.`);
  await say("O que mais te <b>incomoda</b> no seu jogo hoje?");
  A.incomoda=await choose(["Falta potência","Falta controle","Canso rápido","Ainda não tenho raquete","Nada específico"]);
  if(A.incomoda!=="Ainda não tenho raquete"){await say("Qual <b>raquete</b> você usa hoje? Se souber o peso, melhor ainda.");A.raquete=await ask("Ex.: Shark Predator, 360g")}else A.raquete="Ainda não tenho";
  await say("Última: como você se chama?");
  A.nome=await ask("Seu nome");
  const P=perfil();
  track('Lead',{content_category:A.categoria,content_name:P.n});
  await say(`Prontinho, ${A.nome}! Seu perfil é:<br><b>🎾 ${P.n}</b>`);
  await say(P.p);
  await say("Na consultoria eu te digo <b>exatamente qual configuração é a certa pra você</b>.");
  await say("Me chama no WhatsApp que suas respostas já vão junto 💛");
  const msg=`Oi Vanessa! Sou ${A.nome} e fiz o teste da raquete no seu site.\n• Meu perfil: ${P.n}\n• Categoria: ${A.categoria}\n• Jogo: ${A.freq} por semana\n• Torneios: ${A.torneio}\n• Desconforto: ${A.dor}\n• O que incomoda: ${A.incomoda}\n• Raquete: ${A.raquete}\nQuero saber como funciona a consultoria!\n(origem: quiz / ${origem})`;
  reply.innerHTML=`<a class="wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">${WA_ICON}Falar com a Vanessa</a><div class="fine">Consultoria de equipamento. Não substitui avaliação médica.</div>`;
  scroll();document.getElementById('wa').onclick=()=>track('Contact',{content_category:A.categoria,content_name:P.n});
})();
</script>
