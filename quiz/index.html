<style>
:root{--gold:#e8d94a;--gold-d:#d1c12a;--dark:#121212;--card:#1c1c1c;--muted:#262626;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--dark);color:#fff;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Montserrat,system-ui,sans-serif;line-height:1.12;letter-spacing:-.01em}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--dark);font-weight:700;font-family:Montserrat,sans-serif;text-decoration:none;padding:16px 26px;border-radius:12px;font-size:16px;border:0;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold-d)}
.wa-float{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 20px #0006;z-index:40}
.wa-float svg{width:30px;height:30px}
</style>

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5PMSVCMT" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<style>
body{min-height:100svh}
.q{max-width:520px;margin:0 auto;padding:22px 18px 40px;min-height:100svh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.brand b{font-family:Montserrat,sans-serif;font-size:14px;display:block}
.brand small{color:#ffffffa0;font-size:12px}
.bar{height:6px;background:var(--muted);border-radius:9px;overflow:hidden;margin-bottom:26px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}
.step{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:30px;margin-bottom:14px}
h1 em{color:var(--gold);font-style:italic}
h2{font-size:22px;margin-bottom:8px}
.sub{color:#ffffffb3;font-size:15px;margin-bottom:22px}
.hero{border-radius:18px;overflow:hidden;margin-bottom:22px;aspect-ratio:4/3;background:var(--card)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.pill{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 22px}
.pill span{font-size:12px;color:#ffffffc0;background:var(--card);border:1px solid #ffffff1a;padding:6px 10px;border-radius:99px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);color:#fff;border:1.5px solid #ffffff1f;border-radius:14px;padding:16px 16px;font:500 16px Inter,sans-serif;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.opt:active{background:#2a2a1a}
.opt .e{font-size:20px;width:26px;text-align:center}
.opt small{display:block;color:#ffffff90;font-size:13px;font-weight:400;margin-top:2px}
input.tx{width:100%;background:var(--card);border:1.5px solid #ffffff2a;border-radius:14px;padding:16px;color:#fff;font:500 16px Inter,sans-serif;margin-bottom:12px}
input.tx:focus{outline:none;border-color:var(--gold)}
.btn{width:100%}
.skip{background:none;border:0;color:#ffffff90;font:500 14px Inter,sans-serif;margin-top:14px;cursor:pointer;text-decoration:underline;width:100%}
.back{background:none;border:0;color:#ffffff90;font:500 14px Inter,sans-serif;cursor:pointer;margin-top:18px;align-self:flex-start}
.res{background:linear-gradient(160deg,#25230f,#1c1c1c 55%);border:1px solid #e8d94a40;border-radius:18px;padding:22px;margin-bottom:18px}
.res h2{font-size:24px;color:var(--gold);margin-bottom:10px}
.res p{color:#ffffffd0;font-size:15px;margin-bottom:14px}
.res ul{list-style:none;display:grid;gap:10px}
.res li{display:flex;gap:10px;font-size:14.5px;color:#ffffffe0}
.res li:before{content:"✓";color:var(--gold);font-weight:800}
.offer{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;font-size:14.5px;color:#ffffffd0}
.offer b{color:#fff}
.offer .pr{display:grid;gap:8px;margin-top:12px}
.offer .pr div{border-top:1px solid #ffffff14;padding-top:8px}
.offer .pr span{display:block}
.offer .pr span:first-child{color:#fff;font-weight:600}
.offer .pr span:last-child{color:var(--gold);font-size:13.5px}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#fff;font:700 17px Montserrat,sans-serif;text-decoration:none;padding:18px;border-radius:14px;box-shadow:0 8px 24px #25d36640}
.wa svg{width:24px;height:24px}
.fine{color:#ffffff70;font-size:12px;text-align:center;margin-top:12px}
.nao{display:flex;gap:10px;align-items:flex-start;background:#ffffff0a;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#ffffffc0;margin-bottom:22px}
</style>
<main class="q">
  <div class="brand"><img src="/img/vanessa-photo-2.jpg" alt="Vanessa Kreitchmann"><div><b>Vanessa Kreitchmann</b><small>Consultoria de raquetes de beach tennis</small></div></div>
  <div class="bar" id="bar"><i id="barI"></i></div>
  <div id="app"></div>
</main>
<script>
const WHATSAPP="555189418635";
const app=document.getElementById('app'),bar=document.getElementById('bar'),barI=document.getElementById('barI');
const utm=new URLSearchParams(location.search);
const origem=["utm_source","utm_campaign","utm_content"].map(k=>utm.get(k)).filter(Boolean).join(" / ")||"site";
const track=(ev,data)=>{try{fbq('track',ev,data)}catch(e){}try{ttq.track(ev==='Contact'?'Contact':'SubmitForm')}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WA_ICON='<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>';

const Q=[
 {id:"categoria",t:"Qual a sua categoria hoje?",o:[["🌱","Iniciante","Comecei há pouco tempo"],["🎾","D"],["🎾","C"],["🏆","B"],["🏆","A / Pro"]]},
 {id:"freq",t:"Quantas vezes por semana você joga?",o:[["1️⃣","1x"],["2️⃣","2x"],["3️⃣","3x"],["🔥","4x ou mais"]]},
 {id:"torneio",t:"Você disputa torneios?",o:[["🏆","Sim, com frequência"],["🎯","De vez em quando"],["🙂","Não, jogo por diversão"]]},
 {id:"dor",t:"Sente algum desconforto depois de jogar?",o:[["💢","Cotovelo"],["💢","Ombro"],["✋","Punho / mão"],["❓","Outro lugar"],["✅","Não sinto nada"]]},
 {id:"incomoda",t:"O que mais te incomoda no seu jogo hoje?",o:[["💥","Falta potência","A bola não sai com força"],["🎯","Falta controle","A bola foge, erro demais"],["😮‍💨","Canso rápido","A raquete pesa no fim do jogo"],["🆕","Ainda não tenho raquete","Quero acertar a primeira"],["👌","Nada específico","Quero evoluir mais"]]},
 {id:"raquete",t:"Qual raquete você usa hoje?",txt:"Ex.: Shark Predator, 360g",opt:true,sub:"Se souber o peso, melhor ainda. Pode pular."},
 {id:"nome",t:"Como você se chama?",txt:"Seu nome",sub:"Pra eu já te chamar pelo nome no WhatsApp."}
];
const A={};let i=-1;

function intro(){
  bar.style.display='none';
  app.innerHTML=`<div class="step">
   <div class="hero"><img src="/img/vanessa-hero.jpg" alt="Vanessa Kreitchmann em quadra"></div>
   <p class="k">Teste rápido · 1 minuto</p>
   <h1>Sua raquete <em>combina</em> com o seu jogo?</h1>
   <p class="sub">Responda 7 perguntas e descubra o seu perfil de jogadora ou jogador, o que pode estar te travando em quadra e qual o próximo passo.</p>
   <div class="pill"><span>✓ Gratuito</span><span>✓ Resultado na hora</span><span>✓ +1.000 atletas atendidos</span></div>
   <div class="nao">🎾 <div>Eu <b>não vendo raquetes</b>. Meu trabalho é te ajudar a escolher a certa para o seu jogo, sem interesse em marca.</div></div>
   <button class="btn" id="go">Descobrir meu perfil →</button></div>`;
  document.getElementById('go').onclick=()=>{track('ViewContent',{content_name:'quiz_inicio'});next()};
}
function next(){i++; i<Q.length?show():result()}
function show(){
  const q=Q[i];bar.style.display='block';barI.style.width=((i)/Q.length*100)+'%';
  let h=`<div class="step"><p class="k">Pergunta ${i+1} de ${Q.length}</p><h2>${q.t}</h2>${q.sub?`<p class="sub">${q.sub}</p>`:'<div style="height:14px"></div>'}`;
  if(q.o){h+='<div class="opts">'+q.o.map((o,n)=>`<button class="opt" data-n="${n}"><span class="e">${o[0]}</span><span>${o[1]}${o[2]?`<small>${o[2]}</small>`:''}</span></button>`).join('')+'</div>'}
  else{h+=`<input class="tx" id="tx" placeholder="${q.txt}" maxlength="60" autocomplete="${q.id==='nome'?'given-name':'off'}" value="${A[q.id]&&A[q.id]!=='Não informei'?esc(A[q.id]):''}"><button class="btn" id="ok">Continuar →</button>${q.opt?'<button class="skip" id="sk">Não sei / pular</button>':''}`}
  if(i>0)h+='<button class="back" id="bk">‹ Voltar</button>';
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
  if(q.o)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{A[q.id]=q.o[+b.dataset.n][1];next()});
  else{const tx=document.getElementById('tx'),go=()=>{const v=tx.value.trim();if(!v&&!q.opt){tx.focus();tx.style.borderColor='#ff6b6b';return}A[q.id]=v||'Não informei';next()};
    document.getElementById('ok').onclick=go;tx.onkeydown=e=>{if(e.key==='Enter')go()};const sk=document.getElementById('sk');if(sk)sk.onclick=()=>{A[q.id]='Não informei';next()};
    if(matchMedia('(pointer:fine)').matches)tx.focus()}
  const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{i-=2;next()};
}
function perfil(){
  const dor=A.dor!=="Não sinto nada", ini=A.categoria==="Iniciante"||A.incomoda==="Ainda não tenho raquete";
  const comp=A.torneio!=="Não, jogo por diversão", intenso=["3x","4x ou mais"].includes(A.freq);
  if(dor) return {n:"Raquete pesando no braço",p:`Desconforto no ${A.dor.toLowerCase()} é o relato que eu mais escuto nas consultorias${intenso?', ainda mais em quem joga '+A.freq+' por semana':''}. Muitas vezes tem a ver com peso, balance ou rigidez da raquete, e não com o seu jogo.`,
    b:["Peso e balance podem estar sobrecarregando o braço","A rigidez da raquete muda o impacto a cada batida","Às vezes nem precisa trocar: um ajuste já resolve"]};
  if(ini) return {n:"Primeira raquete",p:"Você está na melhor hora para acertar. A primeira raquete certa faz o jogo evoluir bem mais rápido e evita gastar duas vezes.",
    b:["Raquete muito avançada atrapalha quem está começando","Peso e formato certos dão confiança desde o início","Você evita a compra por impulso (ou por indicação de vendedor)"]};
  if(A.incomoda==="Falta potência") return {n:"Jogo pedindo mais potência",p:"A sensação de que a bola não sai pode vir da configuração da raquete, não só da técnica.",
    b:["Balance e EVA mudam a saída de bola","Raquete mais pesada nem sempre é mais potente","Dá pra ganhar força sem perder controle"]};
  if(A.incomoda==="Falta controle") return {n:"Jogo pedindo mais controle",p:"Bola que foge e erros a mais costumam ter relação com uma raquete que não combina com o seu estilo.",
    b:["Ponto doce e balance influenciam a precisão","Raquete muito rígida pode deixar a bola 'escapar'","O ajuste certo dá mais consistência nos pontos longos"]};
  if(A.incomoda==="Canso rápido") return {n:"Raquete pesada para o seu ritmo",p:`Cansar no fim do jogo${intenso?' jogando '+A.freq+' por semana':''} é sinal de que o equipamento pode estar exigindo mais do que deveria.`,
    b:["Peso total e balance pesam mais do que parece","Fadiga derruba a técnica no fim do set","Uma configuração mais leve pode render mais"]};
  if(comp) return {n:"Competidor(a) buscando o próximo nível",p:`Na categoria ${A.categoria}, com torneios no calendário, os detalhes do equipamento fazem diferença em resultado.`,
    b:["Configuração alinhada ao seu estilo de jogo","Mais consistência quando a pressão aumenta","Decisão técnica, sem influência de marca"]};
  return {n:"Ajuste fino no equipamento",p:"Seu jogo está bem encaminhado. Com peso, balance e EVA alinhados ao seu estilo, dá pra ganhar controle e conforto.",
    b:["Pequenos ajustes, grande diferença","Saber se a sua raquete atual ainda é a ideal","Escolha certa na próxima troca"]};
}
function result(){
  barI.style.width='100%';
  const P=perfil();
  track('Lead',{content_category:A.categoria,content_name:P.n});
  const msg=`Oi Vanessa! Sou ${A.nome} e fiz o teste da raquete no seu site.\n• Meu perfil: ${P.n}\n• Categoria: ${A.categoria}\n• Jogo: ${A.freq} por semana\n• Torneios: ${A.torneio}\n• Desconforto: ${A.dor}\n• O que incomoda: ${A.incomoda}\n• Raquete: ${A.raquete}\nQuero saber como funciona a consultoria!\n(origem: quiz / ${origem})`;
  app.innerHTML=`<div class="step">
   <p class="k">Seu resultado</p>
   <div class="res"><h2>${P.n}</h2><p>${esc(A.nome)}, ${P.p[0].toLowerCase()+P.p.slice(1)}</p><ul>${P.b.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="offer">Quer saber <b>exatamente qual configuração é a certa pra você</b>? Na consultoria eu analiso o seu jogo e te indico o caminho, sem vender raquete nenhuma.
    <div class="pr"><div><span>Consultoria Completa</span><span>videochamada + acompanhamento</span></div><div><span>Consultoria Express</span><span>por áudio e mensagem</span></div></div></div>
   <a class="wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}">${WA_ICON}Falar com a Vanessa</a>
   <div class="fine">Suas respostas já vão na mensagem. Consultoria de equipamento: não substitui avaliação médica.</div>
   <button class="back" id="re">↺ Refazer o teste</button></div>`;
  window.scrollTo(0,0);
  document.getElementById('wa').onclick=()=>track('Contact',{content_category:A.categoria,content_name:P.n});
  document.getElementById('re').onclick=()=>{for(const k in A)delete A[k];i=-1;intro()};
}
intro();
</script>

</body>
</html>
